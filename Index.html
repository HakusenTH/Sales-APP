<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกการขาย & สแกน IMEI</title>
    
    <!-- แจ้งให้เบราว์เซอร์รู้ว่าเป็น PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#87BBA2">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

    <!-- Tesseract.js สำหรับ OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <!-- เชื่อมต่อไฟล์ CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>💰 ระบบบันทึกการขาย</h2>
        
        <!-- Dashboard -->
        <div class="summary-cards">
            <div class="summary-card">
                <h3 id="todayCount">0</h3>
                <p>ขายวันนี้ (เครื่อง)</p>
            </div>
            <div class="summary-card month">
                <h3 id="monthComm">0</h3>
                <p>คอมมิชชั่นเดือนนี้ (บาท)</p>
            </div>
        </div>

        <!-- ฟอร์มบันทึกการขาย -->
        <div style="background: #fafafa; padding: 20px; border-radius: 12px; border: 1px solid #eee;">
            <div class="input-group">
                <label>ค้นหาแบรนด์ / รุ่น (พิมพ์ย่อๆ)</label>
                <input type="text" id="searchInput" placeholder="เช่น ip15, s24, rn11" autocomplete="off" onkeyup="searchProduct()">
                <div id="suggestions"></div>
            </div>

            <!-- แสดงสินค้าที่เลือก -->
            <div id="selectedProduct" class="selected-product">
                <div>
                    <strong id="dispBrandModel"></strong><br>
                    <small>คอมมิชชั่น: <span id="dispComm" class="comm-text"></span> บาท</small>
                </div>
                <button onclick="clearSelection()" style="width: auto; padding: 5px 10px; background: #ccc; margin:0;">เปลี่ยน</button>
            </div>

            <div class="input-group">
                <label>รหัส IMEI (15 หลัก)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="imeiInput" placeholder="กรอกหรือสแกน IMEI" maxlength="15">
                    <button class="btn-camera" style="width: 80px; margin: 0;" onclick="openCamera()">📷</button>
                </div>
            </div>

            <button onclick="saveSale()">💾 บันทึกรายการขาย</button>
            <p id="saveStatus" style="text-align:center; font-size: 0.9em; margin-top: 5px;"></p>
        </div>

        <!-- ประวัติการขายวันนี้ -->
        <h4 style="margin-top: 30px; margin-bottom: 10px; color: var(--secondary);">รายการขายล่าสุด</h4>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>เวลา</th>
                        <th>สินค้า</th>
                        <th>IMEI</th>
                        <th>คอมฯ</th>
                    </tr>
                </thead>
                <tbody id="salesTableBody">
                    <!-- ประวัติจะมาแสดงตรงนี้ -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Camera Modal สำหรับ OCR -->
    <div id="cameraModal">
        <h3 style="color: white; margin-bottom: 10px;">กรอบเลข IMEI ให้อยู่ในเส้นสีเขียว</h3>
        <p id="ocrStatus" style="color: #00ff00; margin-bottom: 15px; min-height: 20px;"></p>
        
        <div class="camera-container">
            <video id="videoElement" autoplay playsinline></video>
            <div class="scan-box"></div>
        </div>
        <canvas id="canvasElement" style="display: none;"></canvas>
        
        <div class="camera-controls">
            <button onclick="captureAndOCR()">🔍 สแกนและอ่านข้อความ</button>
            <button class="btn-danger" onclick="closeCamera()">ยกเลิก</button>
        </div>
    </div>

    <!-- เชื่อมต่อไฟล์ JavaScript -->
    <script src="script.js"></script>

    <!-- ติดตั้ง Service Worker สำหรับทำ PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.error('Service Worker Registration Failed!', err));
            });
        }
    </script>
</body>
</html>
