<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสาขา & การขาย</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#87BBA2">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    
    <!-- Tesseract.js สำหรับ OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. หน้า Login -->
    <div id="loginSection" class="container">
        <h2>ระบบจัดการพนักงานสาขา</h2>
        <div class="input-group"><input type="email" id="email" placeholder="อีเมลพนักงาน"></div>
        <div class="input-group"><input type="password" id="password" placeholder="รหัสผ่าน"></div>
        <button onclick="login()">เข้าสู่ระบบ</button>
        <p class="status" id="loginStatus"></p>
    </div>

    <!-- 2. เมนูหลัก -->
    <div id="mainMenu" class="container hidden">
        <h2 id="welcomeMsg">สวัสดี</h2>
        <div style="background: #eef2f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
            สถานะวันนี้: <strong id="currentStatus" style="color: #E27D60;">ยังไม่เข้างาน</strong>
        </div>
        
        <button class="btn-menu" onclick="navToCheckIn()">📍 ลงเวลา & ตรวจสาขา</button>
        <button class="btn-menu" onclick="navToSales()" style="background-color: var(--secondary);">💰 บันทึกการขาย</button>
        <button class="btn-outline" style="margin-top: 20px;" onclick="logout()">ออกจากระบบ</button>
    </div>

    <!-- 3. หน้าลงเวลา & Checklist -->
    <div id="checkInSection" class="container hidden">
        <button class="btn-small btn-outline" style="margin-bottom: 15px;" onclick="showMenu()">🔙 กลับเมนูหลัก</button>
        <h2>📍 ลงเวลาเข้า-ออกงาน</h2>

        <div class="status-selector">
            <label><input type="radio" name="workStatus" value="work" checked> 💼 ทำงานปกติ</label>
        </div>

        <div class="checklist">
            <h4>📋 ตรวจสอบสาขาก่อนเริ่มงาน</h4>
            <div class="photo-task">
                <span>1. เดโม่</span>
                <button class="btn-small" onclick="openCameraFor('demo')">📸 ถ่ายรูป</button>
                <img id="preview-demo" class="thumbnail hidden">
            </div>
            <div class="photo-task">
                <span>2. สเปคการ์ด</span>
                <button class="btn-small" onclick="openCameraFor('spec')">📸 ถ่ายรูป</button>
                <img id="preview-spec" class="thumbnail hidden">
            </div>
            <div class="photo-task">
                <span>3. ความสะอาด</span>
                <button class="btn-small" onclick="openCameraFor('clean')">📸 ถ่ายรูป</button>
                <img id="preview-clean" class="thumbnail hidden">
            </div>
            <div class="stock-check">
                <strong>📦 สต๊อคสินค้า:</strong>
                <label><input type="radio" name="stockStatus" value="เพียงพอ"> ✅ เพียงพอ</label>
                <label><input type="radio" name="stockStatus" value="ต้องเติม"> ⚠️ ไม่เพียงพอ (ต้องเติม)</label>
            </div>
        </div>
        
        <button onclick="startMainCheckIn('เข้างาน')">📍 บันทึกเข้างาน</button>
        <button class="btn-danger" onclick="startMainCheckIn('ออกงาน')">📍 บันทึกออกงาน</button>
        <p class="status" id="actionStatus"></p>
    </div>

    <!-- 4. หน้าบันทึกการขาย -->
    <div id="salesSection" class="container hidden">
        <button class="btn-small btn-outline" style="margin-bottom: 15px;" onclick="showMenu()">🔙 กลับเมนูหลัก</button>
        <h2>💰 ระบบบันทึกการขาย</h2>
        
        <div class="summary-cards">
            <div class="summary-card">
                <h3 id="todayCount">0</h3>
                <p>ขายวันนี้</p>
            </div>
            <div class="summary-card month">
                <h3 id="monthComm">0</h3>
                <p>คอมมิชชั่น</p>
            </div>
        </div>

        <div style="background: #fafafa; padding: 20px; border-radius: 12px; border: 1px solid #eee;">
            <div class="input-group">
                <label>แบรนด์ / รุ่น</label>
                <input type="text" id="searchInput" placeholder="พิมพ์ชื่อย่อ เช่น ip15, s24" autocomplete="off" onkeyup="searchProduct()">
                <div id="suggestions"></div>
            </div>

            <div id="selectedProduct" class="selected-product">
                <div>
                    <strong id="dispBrandModel"></strong><br>
                    <small>คอมมิชชั่น: <span id="dispComm" class="comm-text"></span> บาท</small>
                </div>
                <button onclick="clearSelection()" style="width: auto; padding: 5px 10px; background: #ccc; margin:0;">เปลี่ยน</button>
            </div>

            <div class="input-group">
                <label>รหัส IMEI (15 หลัก)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="imeiInput" placeholder="กรอกหรือสแกน IMEI" maxlength="15">
                    <button class="btn-camera" style="width: 80px; margin: 0;" onclick="openCameraFor('ocr')">📷</button>
                </div>
            </div>

            <button onclick="saveSale()">💾 บันทึกยอดขาย</button>
            <p id="saveStatus" style="text-align:center; font-size: 0.9em; margin-top: 5px;"></p>
        </div>

        <div style="overflow-x: auto; margin-top: 20px;">
            <table>
                <thead>
                    <tr><th>เวลา</th><th>สินค้า</th><th>IMEI</th><th>คอมฯ</th></tr>
                </thead>
                <tbody id="salesTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 5. Camera Modal แบบใช้งานร่วมกัน -->
    <div id="cameraModal">
        <h3 id="cameraTitle" style="color: white; margin-bottom: 10px;">📸 กล้อง</h3>
        <p id="cameraSubtitle" style="color: #ccc; font-size: 0.9em; margin-bottom: 15px;"></p>
        
        <div class="camera-container">
            <video id="videoElement" autoplay playsinline></video>
            <div id="scanBox" class="scan-box hidden"></div>
        </div>
        <canvas id="canvasElement" style="display: none;"></canvas>
        
        <div class="camera-controls">
            <button id="btnCapture" onclick="takeSnapshot()">ถ่ายรูป / สแกน</button>
            <button class="btn-danger" onclick="closeCamera()">ยกเลิก</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>
</html>
